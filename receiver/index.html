<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMS Receiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&display=swap">
<style>
  /* RMS's Cast receiver: what a Chromecast shows while it plays for RMS.  projectM's
     visuals, the server's visualiser video, or the cover (blurred, behind) fill the
     screen; the playing track sits in the lower left (viz.js's TrackOverlay).  TVs crop
     their edges, so everything stays inside a 5% margin. */
  :root {
    --stage: #05060a;
    --fg: #f2f3fb;
    --dim: rgba(222, 226, 245, 0.72);
    --sans: "Familjen Grotesk", "Roboto", ui-sans-serif, system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--stage); }
  body { color: var(--fg); font-family: var(--sans); cursor: none; }
  .stage { position: fixed; inset: 0; --rms-safe-x: 5vw; --rms-safe-y: 5vh; }
  #canvas, #media, .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #media { object-fit: contain; background: var(--stage); visibility: hidden; }
  body.video #media { visibility: visible; }
  body:not(.draw) #canvas { visibility: hidden; }

  /* the now-playing screen: the cover, blurred and dimmed, behind the track */
  .backdrop {
    background: center / cover no-repeat; filter: blur(48px) brightness(0.45) saturate(1.2);
    transform: scale(1.15); opacity: 0; transition: opacity 1s ease;
  }
  body.cover .backdrop { opacity: 1; }

  /* nothing playing yet */
  .idle {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    transition: opacity 0.8s ease;
  }
  body.active .idle { opacity: 0; }
  .idle .name { font-size: 40px; font-weight: 600; letter-spacing: 0.04em; }
  .idle .hint { font-size: 20px; color: var(--dim); margin-top: 10px; }

  .debug {
    position: absolute; right: 5vw; top: 5vh; font-size: 16px; color: var(--dim);
    font-variant-numeric: tabular-nums; text-align: right; white-space: pre-line;
  }
  @media (prefers-reduced-motion: reduce) { .idle, .backdrop { transition: none; } }
</style>
</head>
<body class="draw">
<div class="stage" id="stage">
  <div class="backdrop" id="backdrop"></div>
  <canvas id="canvas"></canvas>
  <video id="media" crossorigin="anonymous" playsinline></video>
  <div class="idle">
    <div>
      <div class="name">RMS</div>
      <div class="hint" id="idle-hint">Starting…</div>
    </div>
  </div>
  <div class="debug" id="debug" hidden></div>
</div>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script type="module" src="receiver.js"></script>
</body>
</html>
