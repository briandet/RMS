[package]
name = "rms"
description = "Rusty Music Server — a Rust implementation of the Lyrion/Logitech Media Server protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "rms"

[[bin]]
name = "rms"
path = "src/main.rs"

[dependencies]
slimproto = { path = "../slimproto" }
rms-library = { path = "../library" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-stream = "0.1"
bytes = { workspace = true }
futures = "0.3"
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# the real target of librespot's `log` records (Spotify's refused keys)
tracing-log = "0.2"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["http1", "json", "query", "tokio", "macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }
http-body-util = "0.1"
hyper = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup", "hooks"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
lofty = "0.22"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
parking_lot = "0.12"
dashmap = "6"
chrono = "0.4"
md5 = "0.8"
regex = "1"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
quick-xml = { version = "0.37", features = ["serialize"] }
unicode-normalization = "0.1"
humantime = "2"
mime_guess = "2"
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
local-ip-address = "0.6"
hostname = "0.4"
encoding_rs = "0.8"
base64 = "0.22"
async-trait = "0.1"
socket2 = "0.5"
roxmltree = "0.20"
# Spotify: librespot for the session and audio, the Web API for browsing
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"
protobuf = "3"
protobuf-json-mapping = "3"
sha2 = "0.10"
sha1 = "0.10"
flacenc = { version = "0.5", default-features = false }
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
notify = "8"
mdns-sd = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
aes = "0.8"
cbc = "0.1"
rsa = "0.9"

[dev-dependencies]
claxon = "0.4"
# librespot's log records, as it sends them (Spotify's refused keys)
log = "0.4"
tempfile = "3"
tokio-tungstenite = "0.28"
